# Récupère les sommets nommés autour des traces et les commite.
# À lancer depuis l'onglet Actions de GitHub (bouton « Run workflow »),
# y compris depuis l'application mobile : aucun terminal nécessaire.
name: Sommets alentour

on:
  workflow_dispatch:
    inputs:
      radius:
        description: "Cercle proche : on garde tout sommet nommé (km)"
        default: "12"
      far:
        description: "Cercle lointain : seulement les grands sommets (km)"
        default: "60"
      far_ele:
        description: "Altitude minimale au bord du cercle proche (m)"
        default: "1800"
      far_ele_max:
        description: "Altitude minimale au bord du cercle lointain (m)"
        default: "3200"
      max:
        description: "Nombre maximum de sommets par sortie"
        default: "80"

permissions:
  contents: write

jobs:
  sommets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Comme pour la vidéo : les entrées passent par l'environnement, pas par
      # le texte de la commande.
      - name: Interroger OpenStreetMap
        env:
          P_RADIUS: ${{ inputs.radius }}
          P_FAR: ${{ inputs.far }}
          P_FAR_ELE: ${{ inputs.far_ele }}
          P_FAR_ELE_MAX: ${{ inputs.far_ele_max }}
          P_MAX: ${{ inputs.max }}
        run: |
          node scripts/peaks.mjs \
            --radius="$P_RADIUS" \
            --far="$P_FAR" \
            --far-ele="$P_FAR_ELE" \
            --far-ele-max="$P_FAR_ELE_MAX" \
            --max="$P_MAX"

      - name: Résumé
        run: |
          node -e '
            const p = JSON.parse(require("fs").readFileSync("data/peaks.js","utf8").split("= ")[1].replace(/;\s*$/,""));
            for (const [id, v] of Object.entries(p)) {
              const haut = v.filter(s => s[2] !== null).sort((a,b) => b[2]-a[2])[0];
              const loin = v.filter(s => typeof s[4] === "number" && s[4] > 20000).length;
              console.log(`${id} : ${v.length} sommets` + (haut ? ` — le plus haut : ${haut[3]} (${haut[2]} m)` : "") +
                (loin ? `, dont ${loin} à plus de 20 km` : ""));
            }
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Commiter le résultat
        run: |
          if git diff --quiet -- data/peaks.js; then
            echo "Aucun changement." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/peaks.js
          git commit -m "Met à jour les sommets alentour (OpenStreetMap)"
          # La branche peut avoir avancé pendant les dix minutes d'interrogation
          # d'Overpass : on se replace avant de pousser plutôt que de tout perdre.
          for essai in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push refusé, nouvelle tentative ($essai)…"
            sleep 10
          done
          echo "Le push a échoué ; relancer le workflow." >> "$GITHUB_STEP_SUMMARY"
          exit 1
