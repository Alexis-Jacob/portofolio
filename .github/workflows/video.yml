# Exporte un survol en vidéo. À lancer depuis l'onglet Actions (« Run workflow »),
# application mobile comprise. La vidéo est déposée en artefact et commitée dans
# videos/, donc consultable directement depuis le site.
name: Vidéo du survol

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Identifiant de la sortie"
        default: "le-chatelard"
      from:
        description: "Début, de 0 à 1 (portion du parcours)"
        default: "0"
      to:
        description: "Fin, de 0 à 1"
        default: "0.5"
      seconds:
        description: "Durée de la vidéo, en secondes"
        default: "15"
      fps:
        description: "Images par seconde"
        default: "20"
      pano:
        description: "Tour d'horizon ajouté à la fin, en secondes (0 pour aucun)"
        default: "0"
      tour:
        description: "Survol d'ensemble : identifiants séparés par des virgules (vide pour une seule sortie)"
        default: ""
      width:
        default: "960"
      height:
        default: "540"
      title:
        description: "Bandeau affiché en bas (vide pour aucun)"
        default: "Le Châtelard · montée du Mont Julioz · 1 672 m"
      out:
        description: "Fichier produit"
        default: "videos/mont-julioz.mp4"

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Le dépôt n'a volontairement aucune dépendance : on installe à côté et on
      # relie, node_modules/ étant ignoré par git.
      - name: Installer Playwright
        run: |
          mkdir -p /tmp/deps && cd /tmp/deps
          npm init -y > /dev/null
          npm install playwright@^1 ffmpeg-static --silent   # le runner n'a pas ffmpeg
          ln -sfn /tmp/deps/node_modules "$GITHUB_WORKSPACE/node_modules"
          cd "$GITHUB_WORKSPACE"
          npx --yes playwright install --with-deps chromium

      # Les entrées passent par l'environnement, jamais dans le texte de la
      # commande : un titre contenant une apostrophe — « au-dessus d'Annecy » —
      # fermait la chaîne et cassait le script avant le premier calcul.
      - name: Rendre la vidéo
        env:
          FO_TRACK: ${{ inputs.track }}
          FO_FROM: ${{ inputs.from }}
          FO_TO: ${{ inputs.to }}
          FO_SECONDS: ${{ inputs.seconds }}
          FO_FPS: ${{ inputs.fps }}
          FO_PANO: ${{ inputs.pano }}
          FO_TOUR: ${{ inputs.tour }}
          FO_WIDTH: ${{ inputs.width }}
          FO_HEIGHT: ${{ inputs.height }}
          FO_TITLE: ${{ inputs.title }}
          FO_OUT: ${{ inputs.out }}
        run: |
          mkdir -p "$(dirname "$FO_OUT")"
          node scripts/render-flyover.mjs \
            --track="$FO_TRACK" \
            --from="$FO_FROM" --to="$FO_TO" \
            --seconds="$FO_SECONDS" --fps="$FO_FPS" \
            --pano="$FO_PANO" \
            --tour="$FO_TOUR" \
            --width="$FO_WIDTH" --height="$FO_HEIGHT" \
            --title="$FO_TITLE" \
            --out="$FO_OUT"
          ls -lh "$FO_OUT" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survol
          path: ${{ inputs.out }}
          if-no-files-found: warn

      - name: Commiter la vidéo
        env:
          FO_OUT: ${{ inputs.out }}
          FO_TRACK: ${{ inputs.track }}
        run: |
          rm -f node_modules
          if git diff --quiet -- "$FO_OUT" && [ -z "$(git status --porcelain -- "$FO_OUT")" ]; then
            echo "Aucun changement." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FO_OUT"
          git commit -m "Ajoute la vidéo du survol ($FO_TRACK)"
          # Deux rendus lancés en parallèle terminent à quelques minutes d'écart :
          # le second doit se replacer sur la branche avant de pousser.
          for essai in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push refusé, nouvelle tentative ($essai)…"
            sleep 10
          done
          echo "Le push a échoué ; la vidéo reste disponible en artefact." >> "$GITHUB_STEP_SUMMARY"
          exit 1
